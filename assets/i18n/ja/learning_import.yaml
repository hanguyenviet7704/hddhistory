# Errors, one sentence per cause
errorPdfUnreadable: この PDF を読み取れませんでした。別のファイルをお試しください。
errorPdfTooLarge: 資料が大きすぎます。300 ページ以内のものをお試しください。
errorYoutubeNoTranscript: この動画には字幕がないため読み取れません。別の動画をお試しください。
errorYoutubeUnavailable: この動画は開けません。非公開または削除された可能性があります。
errorYoutubeTooLong: 動画が長すぎます。3 時間以内のものをお試しください。
errorYoutubeTooShort: 動画が短すぎます。レッスンに十分な内容になるよう、10 分より長い動画を選んでください。
errorContentTooShort: この資料はレッスンを作るには内容が足りません。
errorAiTimeout: 時間がかかりすぎました。もう一度お試しください。
errorAiFailed: レッスンの作成中に問題が発生しました。もう一度お試しください。
errorInterrupted: 処理が中断されました。もう一度お試しください — 回数は消費されていません。
errorGeneric: 問題が発生しました。もう一度お試しください。
errorNotPremium: 自分の資料からレッスンを作る機能は Premium 限定です。
errorQuotaExceeded: 今週のレッスン作成回数を使い切りました。
errorJobRunning: 作成中のレッスンがあります。完了までお待ちください。
retry: 再試行

