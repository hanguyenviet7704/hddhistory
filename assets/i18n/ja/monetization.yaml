review1Body: 以前はソフトスキルなんて学ぶ価値がないと思っていましたが、アプリのロールプレイで自分の弱点と改善方法に気づけました。おかげで生活面でも大きく成長できました
  👍
review1Title: 日常生活に役立つ
review2Body: Meup の広告を見て、自分はスキルを磨かずただ働くだけで多くのチャンスを逃していたと気づきました。今は毎日練習しています——上達したらまたレビューを更新します！
review2Title: 若い人にこそ使ってほしいアプリ
review3Body: Meup の内容は実際の場面に即していて、自分の感情的な反応に気づき、より冷静になれるようになりました。チームからも前向きな変化を褒められました
  😀
