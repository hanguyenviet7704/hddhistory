# Tickets — the allowance, said out loud before it is spent
ticketNoteBalance(param=count):
  zero: Hết lượt tuần này. Có lại ${limit} lượt vào ${date}.
  one: Còn 1 lượt tuần này.
  other: Còn ${count} lượt tuần này.
ticketNoteFree(param=count):
  zero: Hết lượt tuần này. Premium cho bạn ${premiumLimit} lượt mỗi tuần.
  one: Còn 1 lượt tuần này. Premium cho bạn ${premiumLimit} lượt mỗi tuần.
  other: Còn ${count} lượt tuần này. Premium cho bạn ${premiumLimit} lượt mỗi tuần.
ticketInfoTitle(param=count):
  zero: Đã hết lượt
  one: Còn 1 lượt
  other: Còn ${count} lượt
ticketInfoBody: Mỗi lượt tạo một bài học từ link YouTube hoặc file PDF.
ticketInfoReset(param=count):
  one: Có lại 1 lượt vào ${date}.
  other: Có lại ${count} lượt vào ${date}.
ticketInfoCta: Đã hiểu
