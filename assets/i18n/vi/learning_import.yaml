# Errors, one sentence per cause
errorPdfUnreadable: Không đọc được nội dung tệp PDF này. Thử tệp khác nhé.
errorPdfTooLarge: Tài liệu quá lớn. Thử tài liệu dưới 300 trang.
errorYoutubeNoTranscript: Video này không có phụ đề nên không có gì để đọc. Thử video khác nhé.
errorYoutubeUnavailable: Không mở được video này. Có thể video ở chế độ riêng tư hoặc đã bị xoá.
errorYoutubeTooLong: Video quá dài. Thử video dưới 30 phút.
errorContentTooShort: Tài liệu này không đủ nội dung để soạn thành bài học.
errorAiTimeout: Quá trình mất nhiều thời gian hơn dự kiến. Thử lại nhé.
errorAiFailed: Có trục trặc khi soạn bài. Thử lại nhé.
errorInterrupted: Quá trình bị gián đoạn. Thử lại nhé — lượt của bạn chưa bị trừ.
errorGeneric: Có gì đó không ổn. Thử lại nhé.
errorNotPremium: Tạo bài học từ tài liệu của bạn là tính năng Premium.
errorQuotaExceeded: Bạn đã dùng hết lượt tạo bài trong tuần này.
errorJobRunning: Bạn đang có một bài đang được tạo. Đợi xong rồi tạo tiếp nhé.
retry: Thử lại

