review2Body: Tình cờ xem được quảng cáo của Meup mới nhận ra trước kia chỉ cắm đầu
  làm, không chịu trau dồi kỹ năng nên đã bỏ lỡ nhiều cơ hội. Giờ tôi luyện tập với
  app mỗi ngày - nếu cải thiện sẽ quay lại review tiếp!
review2Title: Người trẻ nên học app này
