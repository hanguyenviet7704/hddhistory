# Tickets — the allowance, said out loud before it is spent
ticketNoteBalance(param=count):
  zero: No tickets left this week. Back to ${limit} on ${date}.
  one: 1 ticket left this week.
  other: ${count} tickets left this week.
ticketNoteFree(param=count):
  zero: No tickets left this week. Premium gives you ${premiumLimit} every week.
  one: 1 ticket left this week. Premium gives you ${premiumLimit} every week.
  other: ${count} tickets left this week. Premium gives you ${premiumLimit} every week.
ticketInfoTitle(param=count):
  zero: 0 tickets left
  one: 1 ticket left
  other: ${count} tickets left
ticketInfoBody: Each ticket creates one lesson from a YouTube video or a PDF.
ticketInfoReset(param=days):
  one: Your ${count} tickets reset in 1 day.
  other: Your ${count} tickets reset in ${days} days.
ticketInfoCta: Got it
noTicketTitle: You're out of tickets
noTicketBody: Premium gives you ${premiumLimit} tickets every week to keep creating your own lessons.
noTicketCta: Go Premium
noTicketDismiss: Not now

