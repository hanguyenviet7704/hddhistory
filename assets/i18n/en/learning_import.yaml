# Errors, one sentence per cause
errorPdfUnreadable: We could not read that PDF. Try a different file.
errorPdfTooLarge: That document is too big. Try one under 300 pages.
errorYoutubeNoTranscript: That video has no captions, so there is nothing to read. Try another video.
errorYoutubeUnavailable: That video cannot be opened. It may be private or deleted.
errorYoutubeTooLong: That video is too long. Try one under 30 minutes.
errorContentTooShort: There is not enough in this material to build a lesson.
errorAiTimeout: This took too long. Please try again.
errorAiFailed: Something went wrong while writing the lesson. Please try again.
errorInterrupted: This got interrupted. Try again — it did not use one of your credits.
errorGeneric: Something went wrong. Please try again.
errorNotPremium: Creating lessons from your own material is a Premium feature.
errorQuotaExceeded: You have used all your tickets this week.
errorJobRunning: You already have a lesson being made. Wait for it to finish.
retry: Try again

