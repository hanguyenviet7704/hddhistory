# MeUp Coach — every fixed line the sheet says.
# Anything the model writes never passes through here; it arrives already in the
# reader's language. See plans/260824-ai-coach-v2 in meup-api.
sheetTitle: MeUp Coach
bubbleSemantics: Open MeUp Coach
failedTitle: Something went wrong on our side. Nothing you said was lost.
retry: Try again
inputHint: "Type, or tap the mic…"

# ⑥ — a small line, never a big button.
escapeLabel: Just log today, nothing more

# Navigation prompts. The Coach's own words at steps answered with a tap.
promptMood: Before we start — how are you feeling today?
promptMoodEnd: Before you go — how are you feeling now?
promptPickNew: You just added a couple of habits. Which one should we talk about first?
promptPickHabit: I got that wrong — which habit did you mean?
pickReroll: Show me three others
habitChipLead: Talking about
habitChipChange: Change habit
habitChipChangeEcho: Change the habit.
promptPersona: How would you like me to speak today?
promptTime: How much time do you have?
promptTell: Tell me about the last time this habit came up. Take your time — I won't cut in.
promptTellFollowUp: "Let me ask about what actually happened: who said what, who did what right then?"
promptFree: Anything on your mind today? I'm listening.
promptIntentTell: "Tell me in one sentence: what did you say or do right then?"
promptNextAction: So what will you do next time?
promptCheckin: Has this habit come up at all in the last few days?
promptPlan: "In your own words: when, and what will you do?"
promptSchedule: "Saved. When should I remind you?"
promptLoop: There's one more thing waiting. Keep going, or stop here?
promptRating: Thank you.
promptEnd: What would you like to do next?
promptJot: Alright. One line for today, and I won't ask anything else.
promptSafety: Thank you for saying that. I don't want you to be alone with it.
promptTwoCols: I've put it into two columns — all in your own words. Move whichever line is the real problem to the right, then write it as one sentence.
promptIntent: "The other day you said: ${context}, you would ${action}. Has there been a moment yet?"

# Shown when the model could not answer. Deliberately empty of content — an
# acknowledgement that claims to have understood something it never read is
# worse than a plain one.
fallbackReply: I hear you.
fallbackNetwork: The connection hiccuped and that last message did not get through — please send it again.


