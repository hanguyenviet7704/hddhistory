  zero: 本周次数已用完。Premium 每周给你 ${premiumLimit} 次。
  one: 本周还剩 1 次。Premium 每周给你 ${premiumLimit} 次。
  other: 本周还剩 ${count} 次。Premium 每周给你 ${premiumLimit} 次。
