.firebase_distribution_android:
  extends: .linux_job_base
  stage: release_skeleton
  allow_failure: false
  script:
    - |
      set -e
      if [ -z "${FIREBASE_TOKEN:-}" ]; then
        echo "Missing FIREBASE_TOKEN in GitLab CI variables."
        exit 1
      fi
    - |
      set -e
      if command -v firebase >/dev/null 2>&1; then
        echo "Firebase CLI is already available."
      else
        if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs npm >/dev/null
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache nodejs npm
          else
            echo "Cannot install node/npm (missing package manager)."
            exit 1
          fi
        fi
        npm install -g firebase-tools >/dev/null
      fi
    - firebase --version
    - bash tools/macos/distribution/distribute_android.sh apk "$FLAVOR"

release:android:firebase:distribution:dev:
  extends: .firebase_distribution_android
  variables:
    FLAVOR: "dev"
  needs:
    - job: build:apk:develop
      artifacts: true
  rules:
    - if: '$ENABLE_FIREBASE_DISTRIBUTION_DEV == "1" && $CI_COMMIT_BRANCH == "develop"'
    - when: never

release:android:firebase:distribution:stg:
  extends: .firebase_distribution_android
  variables:
    FLAVOR: "stg"
  needs:
    - job: build:apk:develop
      artifacts: true
  rules:
    - if: '$ENABLE_FIREBASE_DISTRIBUTION_STG == "1" && $CI_COMMIT_BRANCH == "develop"'
    - when: never

release:android:firebase:distribution:prod:
  extends: .firebase_distribution_android
  variables:
    FLAVOR: "prod"
  needs:
    - job: build:apk:release
      artifacts: true
  rules:
    - if: '$ENABLE_FIREBASE_DISTRIBUTION_PROD == "1" && $CI_COMMIT_BRANCH == "main"'
    - if: '$ENABLE_FIREBASE_DISTRIBUTION_PROD == "1" && $CI_COMMIT_TAG =~ /^v.*/'
    - when: never
