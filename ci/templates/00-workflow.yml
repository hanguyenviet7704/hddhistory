stages:
  - prepare
  - quality
  - build
  - release_skeleton

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never

variables:
  MEUP_CI_IMAGE: "ghcr.io/cirruslabs/flutter:stable"
  MEUP_CI_SKIP_SYSTEM_SETUP: "0"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  LC_ALL: "C.UTF-8"
  LANG: "C.UTF-8"

default:
  image: "$MEUP_CI_IMAGE"
  interruptible: true
  cache:
    key:
      files:
        - pubspec.lock
        - .info/app/build.json
    policy: pull-push
    paths:
      - .pub-cache/
      - .dart_tool/
      - .venv/
      - .cache/pip/

.linux_job_base:
  before_script:
    - |
      set -e
      if [ "${MEUP_CI_SKIP_SYSTEM_SETUP:-0}" = "1" ]; then
        echo "Skipping system package installation (MEUP_CI_SKIP_SYSTEM_SETUP=1)"
      else
        missing_tools=0
        for cmd in jq python3 pip3; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            missing_tools=1
            break
          fi
        done

        if [ "$missing_tools" -eq 0 ]; then
          echo "System tools already available (jq, python3, pip3)"
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y jq python3 python3-venv python3-pip >/dev/null
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache jq python3 py3-pip
        else
          echo "Cannot install required system tools (missing package manager)."
          exit 1
        fi
      fi
    - chmod +x ci/scripts/bootstrap-secrets.sh
    - bash ci/scripts/bootstrap-secrets.sh
    - |
      if [ -f build/ci/runtime.env ]; then
        set -a
        . build/ci/runtime.env
        set +a
      fi
    - flutter --version
    - dart --version

.rules_prepare_quality:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never
