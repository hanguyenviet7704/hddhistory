prepare:generated:
  extends: .linux_job_base
  stage: prepare
  script:
    - flutter pub get
    - bash tools/linux/localization/localization.sh pull
    - bash tools/linux/localization/localization.sh slang
    - dart run build_runner build --delete-conflicting-outputs
  artifacts:
    expire_in: 14 days
    paths:
      - assets/i18n/
      - build/localization/records.json
      - lib/**/*.g.dart
      - lib/**/*.freezed.dart
      - lib/**/*.config.dart
      - lib/**/*.graphql.dart
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never
