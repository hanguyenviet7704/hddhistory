release:android:fastlane:skeleton:
  extends: .linux_job_base
  stage: release_skeleton
  allow_failure: true
  script:
    - |
      set -e
      if command -v ruby >/dev/null 2>&1 && command -v bundle >/dev/null 2>&1; then
        echo "Ruby and bundler are already available."
      elif command -v apt-get >/dev/null 2>&1; then
        DEBIAN_FRONTEND=noninteractive apt-get install -y ruby-full build-essential >/dev/null
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache ruby ruby-bundler build-base
      else
        echo "Cannot install ruby/bundler (missing package manager)."
        exit 1
      fi
    - test -f android/Gemfile
    - test -f android/fastlane/Fastfile
    - grep -q "lane :build_apk" android/fastlane/Fastfile
    - grep -q "lane :build_bundle" android/fastlane/Fastfile
    - grep -q "lane :deploy" android/fastlane/Fastfile
    - |
      if [ -z "${MEUP_PLAYSTORE_JSON:-}" ] && [ -z "${MEUP_PLAYSTORE_JSON_PATH:-}" ] && [ ! -f ".info/key/fastlane_playstore_key.json" ]; then
        echo "Missing Play Store contract: provide MEUP_PLAYSTORE_JSON (or file variable) for phase-2 fastlane."
        exit 1
      fi
    - |
      if [ -f "${MEUP_PLAYSTORE_JSON_PATH:-}" ]; then
        ruby -rjson -e 'JSON.parse(File.read(ARGV[0]))' "${MEUP_PLAYSTORE_JSON_PATH}"
      elif [ -n "${MEUP_PLAYSTORE_JSON:-}" ]; then
        ruby -rjson -e 'JSON.parse(ARGV[0])' "${MEUP_PLAYSTORE_JSON}"
      elif [ -f ".info/key/fastlane_playstore_key.json" ]; then
        ruby -rjson -e 'JSON.parse(File.read(ARGV[0]))' ".info/key/fastlane_playstore_key.json"
      fi
    - cd android && bundle config set path vendor/bundle && bundle install --jobs 4 --retry 3 && bundle exec fastlane lanes
  rules:
    - if: '$MEUP_ENABLE_FASTLANE == "1" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$MEUP_ENABLE_FASTLANE == "1" && $CI_COMMIT_TAG =~ /^v.*/'
      when: manual
    - when: never

release:ios:fastlane:skeleton:
  stage: release_skeleton
  allow_failure: true
  tags:
    - macos
  script:
    - chmod +x ci/scripts/bootstrap-secrets.sh
    - bash ci/scripts/bootstrap-secrets.sh
    - |
      if [ -f build/ci/runtime.env ]; then
        set -a
        . build/ci/runtime.env
        set +a
      fi
    - test -f ios/Gemfile
    - test -f ios/fastlane/Appfile
    - test -f ios/fastlane/Fastfile
    - |
      if [ -z "${MEUP_APPSTORE_P8:-}" ] && [ -z "${MEUP_APPSTORE_P8_PATH:-}" ] && ! ls .info/key/AuthKey_*.p8 >/dev/null 2>&1; then
        echo "Missing App Store key contract: provide MEUP_APPSTORE_P8 (or file variable) for phase-2 fastlane."
        exit 1
      fi
    - |
      APPSTORE_ISSUER_ID="$(ruby -rjson -e 'j=JSON.parse(File.read(ARGV[0])); print(j.dig(\"ios\",\"issuerId\").to_s)' .info/app/app.json 2>/dev/null || true)"
      APPSTORE_KEY_ID="$(ruby -rjson -e 'j=JSON.parse(File.read(ARGV[0])); print(j.dig(\"ios\",\"keyId\").to_s)' .info/app/app.json 2>/dev/null || true)"
      APPSTORE_ISSUER_ID="${MEUP_APPSTORE_ISSUER_ID:-$APPSTORE_ISSUER_ID}"
      APPSTORE_KEY_ID="${MEUP_APPSTORE_KEY_ID:-$APPSTORE_KEY_ID}"
      if [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_KEY_ID" ]; then
        echo "Missing App Store issuer/key contract. Set MEUP_APPSTORE_ISSUER_ID + MEUP_APPSTORE_KEY_ID or provide values in .info/app/app.json"
        exit 1
      fi
    - cd ios && bundle config set path vendor/bundle && bundle install --jobs 4 --retry 3 && bundle exec fastlane lanes
  rules:
    - if: '$MEUP_ENABLE_FASTLANE == "1" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$MEUP_ENABLE_FASTLANE == "1" && $CI_COMMIT_TAG =~ /^v.*/'
      when: manual
    - when: never
