name: Release Skeleton

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release skeleton target"
        required: true
        type: choice
        default: both
        options:
          - android
          - ios
          - both

permissions:
  contents: read

concurrency:
  group: release-skeleton-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_skeleton:
    uses: ./.github/workflows/reusable-release-skeleton.yml
    with:
      target: ${{ inputs.target }}
      ref: ${{ github.ref }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
