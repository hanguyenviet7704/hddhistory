name: Flutter CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter_ci:
    uses: ./.github/workflows/reusable-flutter-ci.yml
    with:
      event_name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
