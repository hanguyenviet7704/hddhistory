name: Flutter CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter_ci_macos:
    if: ${{ vars.ENABLE_LINUX_PIPELINE != '1' }}
    uses: ./.github/workflows/reusable-flutter-ci-macos.yml
    with:
      event_name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit

  flutter_ci_linux:
    if: ${{ vars.ENABLE_LINUX_PIPELINE == '1' }}
    uses: ./.github/workflows/reusable-flutter-ci-linux.yml
    with:
      event_name: ${{ github.event_name }}
      ref: ${{ github.ref }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit
