          ENV_PROD_FILE: ${{ secrets.ENV_PROD_FILE || vars.ENV_PROD_FILE }}
          ENV_PROD_CONTENT: ${{ secrets.ENV_PROD_CONTENT || vars.ENV_PROD_CONTENT }}
          LOCALIZATION_SA_PATH: ${{ secrets.LOCALIZATION_SA_PATH || vars.LOCALIZATION_SA_PATH }}
          LOCALIZATION_SA_JSON: ${{ secrets.LOCALIZATION_SA_JSON || vars.LOCALIZATION_SA_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || vars.FIREBASE_TOKEN }}
        run: |
          chmod +x .gitlab/scripts/bootstrap-secrets.sh
          bash .gitlab/scripts/bootstrap-secrets.sh
          if [ -f build/ci/runtime.env ]; then
            cat build/ci/runtime.env >> "$GITHUB_ENV"
          fi

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: prepare-generated
          path: ${{ github.workspace }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter test
        run: flutter test

  build_apk_develop_dev:
    name: Build APK Develop (dev)
    runs-on: [self-hosted, macOS]
