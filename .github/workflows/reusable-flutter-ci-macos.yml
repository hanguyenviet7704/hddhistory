name: Reusable Flutter CI/CD

on:
  workflow_call:
    inputs:
      event_name:
        required: true
        type: string
      ref:
        required: true
        type: string
      ref_name:
        required: true
        type: string

concurrency:
  group: flutter-ci-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_SKIP_SYSTEM_SETUP: ${{ vars.CI_SKIP_SYSTEM_SETUP }}
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  prepare_generated:
    name: Prepare Generated
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .pub-cache
            .dart_tool
            .venv
            .cache/pip
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock', '.info/app/build.json') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Validate system tools
        run: |
          set -e
          if [ "${CI_SKIP_SYSTEM_SETUP:-0}" = "1" ]; then
            echo "Skipping system setup checks (CI_SKIP_SYSTEM_SETUP=1)"
            exit 0
          fi

          missing_tools=""
          for cmd in jq python3 pip3; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              missing_tools="$missing_tools $cmd"
            fi
          done

          if [ -n "$missing_tools" ]; then
            echo "Missing required tools on macOS runner:$missing_tools"
            echo "Install with: brew install jq python"
            exit 1
          fi

      - name: Bootstrap runtime secrets
        env:
          ENV_DEV_FILE: ${{ secrets.ENV_DEV_FILE || vars.ENV_DEV_FILE }}
          ENV_DEV_CONTENT: ${{ secrets.ENV_DEV_CONTENT || vars.ENV_DEV_CONTENT }}
          ENV_STG_FILE: ${{ secrets.ENV_STG_FILE || vars.ENV_STG_FILE }}
          ENV_STG_CONTENT: ${{ secrets.ENV_STG_CONTENT || vars.ENV_STG_CONTENT }}
          ENV_PROD_FILE: ${{ secrets.ENV_PROD_FILE || vars.ENV_PROD_FILE }}
          ENV_PROD_CONTENT: ${{ secrets.ENV_PROD_CONTENT || vars.ENV_PROD_CONTENT }}
          LOCALIZATION_SA_PATH: ${{ secrets.LOCALIZATION_SA_PATH || vars.LOCALIZATION_SA_PATH }}
          LOCALIZATION_SA_JSON: ${{ secrets.LOCALIZATION_SA_JSON || vars.LOCALIZATION_SA_JSON }}
          PLAYSTORE_JSON_FILE: ${{ secrets.PLAYSTORE_JSON_FILE || vars.PLAYSTORE_JSON_FILE }}
          PLAYSTORE_JSON: ${{ secrets.PLAYSTORE_JSON || vars.PLAYSTORE_JSON }}
          APPSTORE_P8_FILE: ${{ secrets.APPSTORE_P8_FILE || vars.APPSTORE_P8_FILE }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 || vars.APPSTORE_P8 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || vars.FIREBASE_TOKEN }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || vars.APPSTORE_KEY_ID }}
        run: |
          chmod +x .gitlab/scripts/bootstrap-secrets.sh
          bash .gitlab/scripts/bootstrap-secrets.sh
          if [ -f build/ci/runtime.env ]; then
            cat build/ci/runtime.env >> "$GITHUB_ENV"
          fi

      - name: Tool versions
        run: |
          flutter --version
          dart --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Pull localization
        run: bash tools/macos/localization/localization.sh pull

      - name: Generate slang localization
        run: bash tools/macos/localization/localization.sh slang

      - name: Build generated files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prepare-generated
          retention-days: 14
          if-no-files-found: warn
          path: |
            assets/i18n/**
            build/localization/records.json
            lib/core/constants/gen/**
            lib/config/l10n/**
            lib/**/gen/**
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            lib/**/*.config.dart
            lib/**/*.graphql.dart

