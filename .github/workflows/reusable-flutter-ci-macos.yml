          path: ${{ github.workspace }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          export CI=true
          export SKIP_SYMBOL_UPLOAD=true
          bash tools/macos/build/build_apk.sh dev --ci

      - name: Upload APK artifacts
