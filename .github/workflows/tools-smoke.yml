name: Tools Smoke

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  smoke-unix:
    name: Smoke (macOS/Linux)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make smoke executable
        run: chmod +x tools/smoke.sh

      - name: Run smoke
        run: tools/smoke.sh

  smoke-windows:
    name: Smoke (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke
        shell: cmd
        run: tools\windows\smoke.bat
