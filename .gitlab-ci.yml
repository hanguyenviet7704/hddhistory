image: cirrusci/flutter:3.24.0

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "30.0.3"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"

cache:
  paths:
    - .pub-cache/
    - android/.gradle/

stages:
  - test
  - build
  - deploy

before_script:
  - apt-get update -qq && apt-get install -y -qq git curl unzip openjdk-17-jdk
  - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
  - flutter doctor -v
  - flutter pub get
  - dart run build_runner build --delete-conflicting-outputs

# Test Stage
test:
  stage: test
  script:
    - flutter test
    - flutter analyze
  artifacts:
    reports:
      junit: test-results.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/lines.......: \d+\.\d+\%/'

# Build Jobs for different environments and build types
build:android:dev:apk:
  stage: build
  script:
    - mkdir -p .env
    - |
      cat > .env/.env.dev << EOF
      API_BASE_URL=https://dev.venusshop.top/api/v1
      ENVIRONMENT=development
      DEBUG_MODE=true
      EOF
    - |
      if [ -f "./tools/macos/build/build_apk.sh" ]; then
        chmod +x ./tools/macos/build/build_apk.sh
        ./tools/macos/build/build_apk.sh dev
      else
        flutter build apk --flavor dev --release --obfuscate --split-debug-info=.obfuscation/
      fi
  artifacts:
    name: "android-apk-dev-$CI_COMMIT_SHA"
    paths:
      - build/app/outputs/flutter-apk/*.apk
      - .obfuscation/
    expire_in: 1 week
  only:
    - develop
    - merge_requests

build:android:stg:apk:
  stage: build
  script:
    - mkdir -p .env
    - |
      cat > .env/.env.stg << EOF
      API_BASE_URL=https://dev.venusshop.top/api/v1
      ENVIRONMENT=staging
      DEBUG_MODE=true
      EOF
    - |
      if [ -f "./tools/macos/build/build_apk.sh" ]; then
        chmod +x ./tools/macos/build/build_apk.sh
        ./tools/macos/build/build_apk.sh stg
      else
        flutter build apk --flavor stg --release --obfuscate --split-debug-info=.obfuscation/
      fi
  artifacts:
    name: "android-apk-stg-$CI_COMMIT_SHA"
    paths:
      - build/app/outputs/flutter-apk/*.apk
      - .obfuscation/
    expire_in: 1 week
  only:
    - main
    - /^release\/.*$/
    - merge_requests

build:android:prod:appbundle:
  stage: build
  script:
    - mkdir -p .env
    - |
      cat > .env/.env.prod << EOF
      API_BASE_URL=https://venusshop.top/api/v1
      ENVIRONMENT=production
      DEBUG_MODE=false
      EOF
    # Setup Android signing for production
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
    - |
      cat > android/key.properties << EOF
      storeFile=keystore.jks
      keyAlias=$ANDROID_KEY_ALIAS
      storePassword=$ANDROID_STORE_PASSWORD
      keyPassword=$ANDROID_KEY_PASSWORD
      EOF
    - |
      if [ -f "./tools/macos/build/build_appbundle.sh" ]; then
        chmod +x ./tools/macos/build/build_appbundle.sh
        ./tools/macos/build/build_appbundle.sh prod
      else
        flutter build appbundle --flavor prod --release --obfuscate --split-debug-info=.obfuscation/
      fi
  artifacts:
    name: "android-bundle-prod-$CI_COMMIT_SHA"
    paths:
      - build/app/outputs/bundle/**/*.aab
      - .obfuscation/
    expire_in: 1 month
  only:
    - tags
    - /^prod\/.*$/

# Firebase App Distribution for Dev builds
deploy:firebase:dev:
  stage: deploy
  image: node:18
  dependencies:
    - build:android:dev:apk
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase appdistribution:distribute build/app/outputs/flutter-apk/app-dev-release.apk
      --app $FIREBASE_ANDROID_APP_ID_DEV
      --groups "internal-testers"
      --release-notes "Automated build from develop branch - Commit $CI_COMMIT_SHA"
      --token $FIREBASE_TOKEN
  only:
    - develop
  when: manual

# Firebase App Distribution for Staging builds
deploy:firebase:stg:
  stage: deploy
  image: node:18
  dependencies:
    - build:android:stg:apk
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase appdistribution:distribute build/app/outputs/flutter-apk/app-stg-release.apk
      --app $FIREBASE_ANDROID_APP_ID_STG
      --groups "qa-testers,stakeholders"
      --release-notes "Staging build ready for QA testing - Commit $CI_COMMIT_SHA"
      --token $FIREBASE_TOKEN
  only:
    - main
    - /^release\/.*$/
  when: manual

# Google Play Store deployment for Production builds
deploy:playstore:prod:
  stage: deploy
  image: ruby:3.1
  dependencies:
    - build:android:prod:appbundle
  before_script:
    - gem install fastlane
    - echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-key.json
  script:
    - |
      cat > fastlane/Fastfile << EOF
      default_platform(:android)

      platform :android do
        desc "Deploy to Google Play Store Internal Track"
        lane :deploy_internal do
          upload_to_play_store(
            json_key: 'google-play-key.json',
            package_name: 'com.eup.meup',
            aab: 'build/app/outputs/bundle/prodRelease/app-prod-release.aab',
            track: 'internal',
            release_status: 'completed',
            skip_upload_metadata: true,
            skip_upload_images: true,
            skip_upload_screenshots: true
          )
        end
      end
      EOF
    - mkdir -p fastlane
    - fastlane android deploy_internal
  only:
    - tags
  when: manual

# Manual deployment jobs for different environments
deploy:manual:dev:
  stage: deploy
  image: node:18
  dependencies:
    - build:android:dev:apk
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase appdistribution:distribute build/app/outputs/flutter-apk/app-dev-release.apk
      --app $FIREBASE_ANDROID_APP_ID_DEV
      --groups "internal-testers"
      --release-notes "Manual deployment - Dev environment"
      --token $FIREBASE_TOKEN
  when: manual
  allow_failure: true

deploy:manual:stg:
  stage: deploy
  image: node:18
  dependencies:
    - build:android:stg:apk
  before_script:
    - npm install -g firebase-tools
  script:
    - firebase appdistribution:distribute build/app/outputs/flutter-apk/app-stg-release.apk
      --app $FIREBASE_ANDROID_APP_ID_STG
      --groups "qa-testers,stakeholders"
      --release-notes "Manual deployment - Staging environment"
      --token $FIREBASE_TOKEN
  when: manual
  allow_failure: true

# Cleanup job
cleanup:
  stage: deploy
  script:
    - rm -f android/app/keystore.jks
    - rm -f android/key.properties
    - rm -f google-play-key.json
  when: always
  allow_failure: true