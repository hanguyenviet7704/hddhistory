.quality_changes: &quality_changes
  - lib/**/*.dart
  - test/**/*.dart
  - pubspec.yaml
  - pubspec.lock
  - build.yaml
  - analysis_options.yaml
  - slang.yaml
  - assets/i18n/**/*.yaml

quality:merge-request-policy:
  stage: quality
  script:
    - |
      set -eu
      branch="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_BRANCH:-}}"
      allowed_regex='^(main|develop|release/v?[0-9]+(\.[0-9]+)*|hotfix/MEUP-[0-9]+-[a-z0-9][a-z0-9-]*|(feature|fix|refactor|style|docs|test|chore|perf)/MEUP-[0-9]+-[a-z0-9][a-z0-9-]*)$'

      if ! printf '%s' "$branch" | grep -Eq "$allowed_regex"; then
        echo "Branch name '$branch' is not allowed."
        echo "Use type/MEUP-123-description, hotfix/MEUP-123-description, release/v1.2.3, develop, or main."
        exit 1
      fi

      echo "Merge request policy checks passed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

quality:analyze:
  extends: .linux_job_base
  stage: quality
  needs:
    - job: prepare:generated
      artifacts: true
  script:
    - flutter pub get
    - bash tools/linux/localization/localization.sh slang
    - flutter analyze
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *quality_changes
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never

quality:test:
  extends: .linux_job_base
  stage: quality
  needs:
    - job: prepare:generated
      artifacts: true
  script:
    - flutter pub get
    - bash tools/linux/localization/localization.sh slang
    - flutter test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *quality_changes
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never
