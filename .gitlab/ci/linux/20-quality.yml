.quality_changes: &quality_changes
  - lib/**/*.dart
  - test/**/*.dart
  - pubspec.yaml
  - pubspec.lock
  - build.yaml
  - analysis_options.yaml
  - slang.yaml
  - assets/i18n/**/*.yaml

quality:analyze:
  extends: .linux_job_base
  stage: quality
  needs:
    - job: prepare:generated
      artifacts: true
  script:
    - flutter pub get
    - flutter analyze
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *quality_changes
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never

quality:test:
  extends: .linux_job_base
  stage: quality
  needs:
    - job: prepare:generated
      artifacts: true
  script:
    - flutter pub get
    - flutter test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *quality_changes
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never
