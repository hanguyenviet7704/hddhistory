stages:
  - prepare
  - quality
  - build
  - release_skeleton

workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never

variables:
  CI_SKIP_SYSTEM_SETUP: "0"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  LC_ALL: "C.UTF-8"
  LANG: "C.UTF-8"

default:
  interruptible: true
  # Remove leftover Flutter build output before git fetch. The default
  # `git clean -ffdx` cannot delete nested gRPC .xcframework paths left in
  # build/ by iOS builds, which fails get_sources on the persistent macOS
  # shell runner. Running this before sources are fetched keeps the checkout
  # clean. Restored job artifacts arrive after this hook, so they are unaffected.
  hooks:
    pre_get_sources_script:
      - rm -rf build
  cache:
    key:
      files:
        - pubspec.lock
        - .info/app/build.json
    policy: pull-push
    paths:
      - .pub-cache/
      - .dart_tool/
      - .venv/
      - .cache/pip/

.macos_job_base:
  tags:
    - macos
  before_script:
    - |
      set -e
      if [ "${CI_SKIP_SYSTEM_SETUP:-0}" = "1" ]; then
        echo "Skipping system setup checks (CI_SKIP_SYSTEM_SETUP=1)"
      else
        missing_tools=""
        for cmd in jq python3 pip3; do
          if ! command -v "$cmd" >/dev/null 2>&1; then
            missing_tools="$missing_tools $cmd"
          fi
        done

        if [ -n "$missing_tools" ]; then
          echo "Missing required tools on macOS runner:$missing_tools"
          echo "Install with: brew install jq python"
          exit 1
        else
          echo "System tools already available (jq, python3, pip3)"
        fi
      fi
    - chmod +x .gitlab/scripts/bootstrap-secrets.sh
    - bash .gitlab/scripts/bootstrap-secrets.sh
    - |
      if [ -f build/ci/runtime.env ]; then
        set -a
        . build/ci/runtime.env
        set +a
      fi
    - flutter --version
    - dart --version

.rules_prepare_quality:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - when: never
