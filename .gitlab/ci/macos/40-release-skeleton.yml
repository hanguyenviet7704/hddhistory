release:android:fastlane:skeleton:
  extends: .macos_job_base
  stage: release_skeleton
  allow_failure: true
  script:
    - |
      set -e
      if ! command -v ruby >/dev/null 2>&1; then
        echo "Ruby is required on macOS runner. Install with: brew install ruby"
        exit 1
      fi
      if ! command -v bundle >/dev/null 2>&1; then
        if command -v gem >/dev/null 2>&1; then
          gem install bundler --no-document || true
        fi
      fi
      if ! command -v bundle >/dev/null 2>&1; then
        echo "Bundler is required on macOS runner. Install with: gem install bundler"
        exit 1
      fi
    - test -f android/Gemfile
    - test -f android/fastlane/Fastfile
    - grep -q "lane :build_apk" android/fastlane/Fastfile
    - grep -q "lane :build_bundle" android/fastlane/Fastfile
    - grep -q "lane :deploy" android/fastlane/Fastfile
    - |
      if [ -z "${PLAYSTORE_JSON:-}" ] && [ -z "${PLAYSTORE_JSON_PATH:-}" ] && [ ! -f ".info/key/fastlane_playstore_key.json" ]; then
        echo "Missing Play Store contract: provide PLAYSTORE_JSON (or file variable) for phase-2 fastlane."
        exit 1
      fi
    - |
      if [ -f "${PLAYSTORE_JSON_PATH:-}" ]; then
        ruby -rjson -e 'JSON.parse(File.read(ARGV[0]))' "${PLAYSTORE_JSON_PATH}"
      elif [ -n "${PLAYSTORE_JSON:-}" ]; then
        ruby -rjson -e 'JSON.parse(ARGV[0])' "${PLAYSTORE_JSON}"
      elif [ -f ".info/key/fastlane_playstore_key.json" ]; then
        ruby -rjson -e 'JSON.parse(File.read(ARGV[0]))' ".info/key/fastlane_playstore_key.json"
      fi
    - bash tools/macos/distribution/fastlane/android_fastlane.sh lanes --ci
    - bash tools/macos/distribution/fastlane/android_fastlane.sh deploy --ci --dry-run flavor:prod track:internal
  rules:
    - if: '$ENABLE_FASTLANE == "1" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$ENABLE_FASTLANE == "1" && $CI_COMMIT_TAG =~ /^v.*/'
      when: manual
    - when: never

release:ios:fastlane:skeleton:
  extends: .macos_job_base
  stage: release_skeleton
  allow_failure: true
  script:
    - test -f ios/Gemfile
    - test -f ios/fastlane/Appfile
    - test -f ios/fastlane/Fastfile
    - |
      if [ -z "${APPSTORE_P8:-}" ] && [ -z "${APPSTORE_P8_PATH:-}" ] && ! ls .info/key/AuthKey_*.p8 >/dev/null 2>&1; then
        echo "Missing App Store key contract: provide APPSTORE_P8 (or file variable) for phase-2 fastlane."
        exit 1
      fi
    - |
      APPSTORE_ISSUER_ID="$(ruby -rjson -e 'j=JSON.parse(File.read(ARGV[0])); print(j.dig(\"ios\",\"issuerId\").to_s)' .info/app/app.json 2>/dev/null || true)"
      APPSTORE_KEY_ID="$(ruby -rjson -e 'j=JSON.parse(File.read(ARGV[0])); print(j.dig(\"ios\",\"keyId\").to_s)' .info/app/app.json 2>/dev/null || true)"
      APPSTORE_ISSUER_ID="${APPSTORE_ISSUER_ID:-$APPSTORE_ISSUER_ID}"
      APPSTORE_KEY_ID="${APPSTORE_KEY_ID:-$APPSTORE_KEY_ID}"
      if [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_KEY_ID" ]; then
        echo "Missing App Store issuer/key contract. Set APPSTORE_ISSUER_ID + APPSTORE_KEY_ID or provide values in .info/app/app.json"
        exit 1
      fi
    - bash tools/macos/distribution/fastlane/ios_fastlane.sh lanes --ci
    - bash tools/macos/distribution/fastlane/ios_fastlane.sh deploy --ci --dry-run flavor:prod track:production
  rules:
    - if: '$ENABLE_FASTLANE == "1" && $CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$ENABLE_FASTLANE == "1" && $CI_COMMIT_TAG =~ /^v.*/'
      when: manual
    - when: never
