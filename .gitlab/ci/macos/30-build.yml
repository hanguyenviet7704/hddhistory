build:apk:develop:
  extends: .macos_job_base
  stage: build
  parallel:
    matrix:
      - FLAVOR: ["dev", "stg"]
  needs:
    - quality:analyze
    - quality:test
    - job: prepare:generated
      artifacts: true
  script:
    - export CI=true
    - export SKIP_SYMBOL_UPLOAD=true
    - bash tools/macos/build/build_apk.sh "$FLAVOR" --ci
  artifacts:
    expire_in: 14 days
    paths:
      - build/app/outputs/flutter-apk/app-$FLAVOR-release.apk
      - .obfuscation/
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $FLAVOR == "dev" && $ENABLE_BUILD_DEV == "1"'
    - if: '$CI_COMMIT_BRANCH == "develop" && $FLAVOR == "stg" && $ENABLE_BUILD_STG == "1"'
    - when: never

build:apk:release:
  extends: .macos_job_base
  stage: build
  parallel:
    matrix:
      - FLAVOR: ["dev", "stg", "prod"]
  needs:
    - quality:analyze
    - quality:test
    - job: prepare:generated
      artifacts: true
  script:
    - export CI=true
    - export SKIP_SYMBOL_UPLOAD=true
    - bash tools/macos/build/build_apk.sh "$FLAVOR" --ci
  artifacts:
    expire_in: 14 days
    paths:
      - build/app/outputs/flutter-apk/app-$FLAVOR-release.apk
      - .obfuscation/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $FLAVOR == "dev" && $ENABLE_BUILD_DEV == "1"'
    - if: '$CI_COMMIT_BRANCH == "main" && $FLAVOR == "stg" && $ENABLE_BUILD_STG == "1"'
    - if: '$CI_COMMIT_BRANCH == "main" && $FLAVOR == "prod" && $ENABLE_BUILD_PROD == "1"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/ && $FLAVOR == "dev" && $ENABLE_BUILD_DEV == "1"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/ && $FLAVOR == "stg" && $ENABLE_BUILD_STG == "1"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/ && $FLAVOR == "prod" && $ENABLE_BUILD_PROD == "1"'
    - when: never

build:aab:prod:
  extends: .macos_job_base
  stage: build
  needs:
    - quality:analyze
    - quality:test
    - job: prepare:generated
      artifacts: true
  script:
    - export CI=true
    - export SKIP_SYMBOL_UPLOAD=true
    - bash tools/macos/build/build_appbundle.sh prod --ci
  artifacts:
    expire_in: 14 days
    paths:
      - build/app/outputs/bundle/prodRelease/app-prod-release.aab
      - .obfuscation/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $ENABLE_BUILD_PROD == "1"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/ && $ENABLE_BUILD_PROD == "1"'
    - when: never
