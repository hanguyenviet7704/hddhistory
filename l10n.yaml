arb-dir: assets/arb/app
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/config/l10n
# synthetic-package: false
format: true
nullable-getter: false
untranslated-messages-file: logs/untranslated_messages.json
suppress-warnings: true
project-dir: .
use-deferred-loading: true
use-escaping: true
relax-syntax: true
use-named-parameters: true
gen-inputs-and-outputs-list: logs/inputs_and_outputs.json
# header: 
# required-resource-attributes:
#   - name
#   - description
#   - type
#   - placeholders
# header-file: null
# preferred-supported-locales: en

# To generate the arb files
# flutter pub run intl_translation:extract_to_arb --output-dir=assets/arb lib/config/l10n/app_localizations.dart
# or flutter gen-l10n --arb-dir=assets/arb --output-dir=lib/config/l10n --output-class=AppLocalizations # --output-localization-file=app_localizations.dart --template-arb-file=app_en.arb