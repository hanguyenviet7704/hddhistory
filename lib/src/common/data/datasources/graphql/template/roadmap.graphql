query GetRoadMap(
  $languageCode: String
  $nodeTypes: [String]
  $version: String
  $statusFilter: [String]
  $curriculumVersions: [String]
) {
  roadmapTree(
    languageCode: $languageCode
    nodeTypes: $nodeTypes
    version: $version
    statusFilterCriteria: $statusFilter
    curriculumVersions: $curriculumVersions
  ) {
    id
    icon_image_url
    title
    node_type
    description
    mascot_dialogues
    order_index
    parent_id
    depth
    path
    merged_image {
      title
      description
      sample_output_url
    }
    required_lessons {
      merged_image_work_layer {
        id
        name
        order_index
        background_image_url
        fillable_area_url
      }
      lower_layers {
        id
        name
        order_index
      }
      id
      type
      title
      description
      goal
      max_duration
      guide_points {
        # type
        points {
          x
          y
        }
      }
      evaluation_criteria {
        rubric {
          point_coverage
          on_path
          min_stroke_count
          external_ai_evaluate
        }
        details
      }
      content_blocks {
        type
        image_url
        text
        video_src
      }
      sample_outputs {
        fill_target_image
        sample_output
        hint_dashed_image
        reference_image
        goal_frame_image
        description
      }
      required_tools {
        id
      }
      hints_available
      available_boosters {
        id
        type
        name
      }
      topics {
        icon_image_url
        icon_active_image_url
        #        id
        title
        description
        sample_images {
          sample_image_url
          description
        }
      }
      color_explorations {
        id
        lesson_id
        color_theme_id
        order_index
        learning_objective
        color_theme {
          id
          name
          hex_color
          description
          order_index
        }
        artworks {
          id
          title
          artist_name
          image_url
          thumbnail_url
          description
          year_created
          art_movement
          relevance_score
        }
        created_at
      }
    }
    extras {
      quizzes {
        type
        question
        famous_artworks {
          public_url
        }
        options {
          text
          is_correct_answer
        }
        feedback {
          correct {
            id
            heading
            body
          }
          incorrect {
            id
            heading
            body
          }
        }
      }
    }
  }
}

query GetMyRoadmapProgress {
  myRoadmapProgress {
    profile_id
    node_id
    status
    completed_at
  }
}
