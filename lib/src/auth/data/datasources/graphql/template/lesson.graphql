query GetMyLessonProgress($lessonLayerIds: [ID!], $version: String) {
  myLessonProgress(lesson_layer_ids: $lessonLayerIds, version: $version) {
    profile_id
    lesson_id
    started_at
    completed_at
    highest_score
    latest_artwork {
      image_url
      metadata {
        used_brush_sizes
      }
    }
    merged_image_work_layer {
      name
      order_index
    }
  }
}

query GetMyBoosterInventory {
  boosters {
    id
    name
    type
    description
  }
  myBoosterInventory {
    id
    profile_id
    booster_id
    acquired_at
    source
    status
    expires_at
  }
}
