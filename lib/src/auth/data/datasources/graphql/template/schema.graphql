  myRoadmapProgress: [RoadmapProgress!]!
  feedbackOption(languageCode: String): [FeedbackOption]
  mergedImage(languageCode: String): [MergedImage]
  roadmapTree(
    languageCode: String
    nodeTypes: [String]
    version: String
    statusFilterCriteria: [String]
    curriculumVersions: [String]
  ): [RoadmapNode!]!
  
  brushes(toolIds: [ID], languageCode: String): [Brush!]!
  boosters: [Booster!]!
  myBoosterInventory: [BoosterInventory!]!
  myBoosterCount: [BoosterCount!]!
  myNextLesson: [NextLesson!]!
  myUnlockedBrushes(languageCode: String): [SummaryBrush!]!
  welcomeQuizWithAssessmentForLesson(
    languageCode: String
    lessonId: ID!
    version: String
  ): [WelcomeQuizWithAssessment!]!
  colorPickerChallenges(
    lessonId: ID!
    languageCode: String
    version: String
  ): [ColorPickerChallenge!]!
  colorPickerChallengeWithPalette(
    lessonId: ID!
    languageCode: String
    version: String
  ): ColorPickerChallengeWithPalette
  validateColorSelection(
    challengeId: ID!
    selectedColorIds: [ID!]!
    languageCode: String
  ): ColorSelectionValidation
  colorAreaTargets(
    challengeId: ID!
    languageCode: String
    version: String!
  ): [ColorAreaTarget!]!
  challengeArtworkMetadata(
    challengeId: ID!
    languageCode: String
    version: String
  ): ChallengeArtworkMetadata
  famousArtworks(languageCode: String, version: String!): [FamousArtwork!]!
  availableLecturePicturesForPath(
    path: String!
    languageCode: String
    version: String
  ): [MergedImage!]!
  artworksGroupedByColorTheme(
    languageCode: String
    version: String!
    lessonId: ID
  ): ArtworksGroupedByColorThemeResponse
  famousArtworkDetails(
    artworkId: ID!
    languageCode: String
    version: String!
  ): FamousArtworkDetailsResponse
  energySystemConfig: EnergySystemConfig
  ping: String!
}
