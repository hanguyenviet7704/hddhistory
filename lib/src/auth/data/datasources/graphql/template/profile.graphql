query GetMyProfile($version: String) {
  myProfiles(version: $version) {
    id
    user_id
    nickname
    avatar_url
    skill_level
    preferred_language
    booster_uses_remaining
    unlocked_tools {
      id
      name
      type
    }
    geolocation {
      profile_id
      current_country
      current_country_code
      current_city
      current_region
      current_timezone
      current_latitude
      current_longitude
      geo_source
      geo_last_updated_at
    }
    # lecture_picture_selections {
    #   merged_image_id
    #   selected_path
    #   selection_timestamp
    #   lecture_picture {
    #     id
    #     sample_output_url
    #     description
    #     title
    #   }
    # }
    active_subscriptions {
      id
      profile_id
      status
      subscription_plan {
        id
        plan_name
        external_plan_id
        duration_type
        duration_value
        price
        currency
        is_active
        payment_provider {
          id
          provider_name
          is_active
        }
        features {
          id
          feature_key
          is_active
        }
      }
    }
    number_lesson_completed
    timestamps {
      last_lesson_completed_at
    }
  }
}
