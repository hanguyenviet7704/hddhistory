# build flavor for android and ios command
# dart run flutter_flavorizr
ide: idea

instructions:
  # assets
  # - assets:download
  # - assets:extract

  # android
  # - android:flavorizrGradle
  # - android:buildGradle
  # - android:androidManifest
  # - android:dummyAssets
  # - android:icons

  # huawei
  # - huawei:agconnect

  # flutter
  # - flutter:flavors
  # - flutter:app
  # - flutter:pages
  # - flutter:main
  # - flutter:targets

  # ios
  # - ios:podfile
  - ios:xcconfig
  # - ios:buildTargets
  # - ios:schema
  # - ios:dummyAssets
  # - ios:icons
  - ios:plist
  # - ios:launchScreen

  # google
  # - google:firebase

  # assets
  # - assets:clean

  # ide
  # - ide:config

app:
  android:
    flavorDimensions: "flavor-type"
    buildConfigFields:
      APP_ENVIRONMENT:
        type: "String"
        value: "${flavor}"
  
  ios:
    flavorDimensions: "flavor-type"
    schema: true

flavors:
  dev:
    app:
      name: "Meup Dev"
      icon: "assets/images/common/main_icon.png"

    android:
      applicationId: "com.eup.meup.dev"
      firebase:
        config: "android/app/src/dev/google-services.json"
      resValues:
        app_name:
          type: string
          value: "Meup Dev"
        environment:
          type: string
          value: "development"
      buildConfigFields:
        APP_ENVIRONMENT: 
          type: "String"
          value: "dev"
        API_BASE_URL: 
          type: "String"
          value: "https://dev.api.com"
        IS_DEBUG:
          type: "boolean"
          value: "true"

    ios:
      bundleId: "com.eup.meup.dev"
      buildSettings:
        PRODUCT_BUNDLE_IDENTIFIER: "com.eup.meup.dev"
        # DEVELOPMENT_TEAM: S84XV86MSV 
        # PROVISIONING_PROFILE_SPECIFIER: "Dev-ProvisioningProfile"
      firebase:
        config: "ios/flavors/dev/GoogleService-Info.plist"
      variables:
        API_BASE_URL:
          value: "https://dev.api.com"
        GID_CLIENT_ID:
          value: "116378588635-iuqg7kp6q2h1ejr85tq0g328iqu8711a.apps.googleusercontent.com"
        REVERSED_CLIENT_ID:
          value: "com.googleusercontent.apps.116378588635-iuqg7kp6q2h1ejr85tq0g328iqu8711a"

  stg:
    app:
      name: "Meup Staging"
      icon: "assets/images/common/main_icon.png"

    android:
      applicationId: "com.eup.meup.stg"
      firebase:
        config: "android/app/src/stg/google-services.json"
      resValues:
        app_name:
          type: string
          value: "Meup Staging"
        environment:
          type: string
          value: "staging"
      buildConfigFields:
        APP_ENVIRONMENT: 
          type: "String"
          value: "stg"
        API_BASE_URL: 
          type: "String"
          value: "https://stg.api.com"
        IS_DEBUG:
          type: "boolean"
          value: "true"

    ios:
      bundleId: "com.eup.meup.stg"
      buildSettings:
        PRODUCT_BUNDLE_IDENTIFIER: "com.eup.meup.stg"
        # DEVELOPMENT_TEAM: S84XV86MSV
        # PROVISIONING_PROFILE_SPECIFIER: "Staging-ProvisioningProfile"
      firebase:
        config: "ios/flavors/stg/GoogleService-Info.plist"
      variables:
        API_BASE_URL:
          value: "https://stg.api.com"
        GID_CLIENT_ID:
          value: "116378588635-sv2pe9vmjarvp1srff7bc8v34bt37di4.apps.googleusercontent.com"
        REVERSED_CLIENT_ID:
          value: "com.googleusercontent.apps.116378588635-sv2pe9vmjarvp1srff7bc8v34bt37di4"

  prod:
    app:
      name: "Meup"
      icon: "assets/images/common/main_icon.png"

    android:
      applicationId: "com.eup.meup"
      firebase:
        config: "android/app/src/prod/google-services.json"
      resValues:
        app_name:
          type: string
          value: "Meup"
        environment:
          type: string
          value: "production"
      buildConfigFields:
        APP_ENVIRONMENT: 
          type: "String"
          value: "prod"
        API_BASE_URL: 
          type: "String"
          value: "https://prod.api.com"
        IS_DEBUG:
          type: "boolean"
          value: "false"

    ios:
      bundleId: "com.eup.meup"
      buildSettings:
        PRODUCT_BUNDLE_IDENTIFIER: "com.eup.meup"
        # DEVELOPMENT_TEAM: S84XV86MSV
        # PROVISIONING_PROFILE_SPECIFIER: "Production-ProvisioningProfile"
      firebase:
        config: "ios/flavors/prod/GoogleService-Info.plist"
      variables:
        API_BASE_URL:
          value: "https://prod.api.com"
        GID_CLIENT_ID:
          value: "116378588635-b1cdtenlrjjabjn443sb0el4ll47msog.apps.googleusercontent.com"
        REVERSED_CLIENT_ID:
          value: "com.googleusercontent.apps.116378588635-b1cdtenlrjjabjn443sb0el4ll47msog"