server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html KHÔNG được cache: tên file trong `static/` có băm, nên sau mỗi
    # lần deploy trình duyệt phải đọc lại index để biết băm mới. Giữ index cũ
    # trong cache là nguyên nhân màn hình trắng sau deploy (18/09/2026).
    location = /index.html {
        # `always` để header đi kèm cả phản hồi 304 — đúng nhánh mà trình duyệt
        # đang giữ bản cũ. Không dùng `expires` ở đây, nó tự sinh thêm một
        # Cache-Control nữa và phản hồi sẽ có hai header trùng nhau.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Tài nguyên có băm: thiếu thì phải 404. KHÔNG được rơi vào fallback dưới —
    # nginx sẽ trả index.html (text/html) cho một file .js, trình duyệt chạy HTML
    # như JavaScript rồi chết câm, cả trang trắng không một dòng log.
    location /static/ {
        try_files $uri =404;
    }

    location / {
        # Nếu không có file tĩnh tương ứng, fallback về index.html
        try_files $uri /index.html;
    }

    # Nâng cao hiệu năng (optional)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml;
    gzip_min_length 1000;
}