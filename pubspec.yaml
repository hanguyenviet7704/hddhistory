  # Active rename tool, run this command
  # flutter pub global activate rename
  # To change app name run this command
  # rename setAppName -t ios,android,macos,linux,web,windows -v "YourAppName"

  # To change app bundle id run this command
  # rename setBundleId -t ios,android,macos,linux,web,windows -v "com.your.app.id"

# Flutter gen environment setup
flutter_gen:
  # Optional
  output: lib/core/constants/gen/
  # Optional
  line_length: 200
  # Optional
  parse_metadata: false

  # Optional
  integrations:
    image: true
    flutter_svg: false
    rive: false
    lottie: false

  assets:
    # Optional
    enabled: true
    # Optional
    outputs:
      # Optional
      # Set to true if you want this package to be a package dependency
      # See: https://flutter.dev/docs/development/ui/assets-and-images#from-packages
      package_parameter_enabled: false
      # Optional
      # Available values:
      # - camel-case
      # - snake-case
      # - dot-delimiter
      style: dot-delimiter
      class_name: AppAsset
    exclude: []

  fonts:
    # Optional
    enabled: true
    # Optional
    outputs:
      class_name: AppFont

  colors:
    # Optional
    enabled: true
    # Optional
    inputs: []
    # Optional
    outputs:
      class_name: ColorName

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/app/
    - assets/icons/common/
    - assets/images/app/
    - assets/images/common/
    - assets/svg/app/
    - assets/svg/common/
    - assets/texts/
    - assets/json/
    - assets/lottie/
    # - assets/gif/
    # - assets/audio/
    # - assets/video/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Nunito-Bold.ttf
          weight: 700
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

